[package]
name = "trix-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lets an LLM use trix like a person would, to find bugs and UX problems"
repository = "https://github.com/leofle/trix-probe"

[dependencies]
ab_glyph = "0.2"
alacritty_terminal = "0.26.0"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
png = "0.17"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
